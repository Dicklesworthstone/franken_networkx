# Portable DSR registry entry for franken_networkx.
#
# Doodlestein Self-Releaser (dsr) is the quality/build/release authority
# for this repository (AGENTS.md "Build, Quality, and Release Authority: DSR Only").
# We do NOT use GitHub Actions for ANYTHING, ONLY /dsr.
#
#   DSR_REPOS_FILE=.dsr/repos.yaml dsr quality --tool franken_networkx
#
# DSR quality reads this registry, while builds read repos.d. Keep their check
# inventories identical; the guarded release-verifier test rejects drift.

schema_version: "1.0.0"

tools:
  franken_networkx:
    repo: Dicklesworthstone/franken_networkx
    local_path: /data/projects/franken_networkx
    language: rust
    targets:
      - linux/amd64
      - linux/arm64
      - darwin/arm64
      - darwin/amd64
      - windows/amd64
    checks:
      - cargo fmt --all -- --check
      - RCH_REQUIRE_REMOTE=1 CARGO_BUILD_JOBS=2 rch exec -- cargo check --locked -j 2 --workspace --all-targets
      - RCH_REQUIRE_REMOTE=1 CARGO_BUILD_JOBS=2 rch exec -- cargo clippy --locked -j 2 --workspace --all-targets -- -D warnings
      - RCH_REQUIRE_REMOTE=1 CARGO_BUILD_JOBS=2 rch exec -- cargo test --locked -j 2 --workspace --exclude fnx-python --no-fail-fast
      - .venv/bin/python scripts/fuzz_corpus_replay.py --budget-seconds 10
      - .venv/bin/python scripts/verify_docs.py
      - ./scripts/run_pytest_guarded.sh tests/python/test_instance_dict_memory_leak.py tests/python/test_error_messages.py tests/python/test_thread_safety.py tests/python/test_coverage_gaps.py tests/python/test_delegation_ledger.py tests/python/test_raw_vs_public_audit.py tests/python/test_upstream_divergence_ledger.py tests/python/test_api_ergonomics_audit.py tests/python/test_unused_raw_exposures.py tests/python/test_dijkstra_exact_weight_domain.py tests/test_published_release_verifier.py
      - .venv/bin/python scripts/run_upstream_networkx_suite.py
      - .venv/bin/python scripts/run_python_parity_suite.py --workers 4
